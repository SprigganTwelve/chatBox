version: '3.8'

services:
  db:
    build:
        context: ./ressources/db
        dockerfile: DockerFile  
    
    container_name: my_mariadb

    environment: 
        MYSQL_ROOT_PASSWORD: rootpassword@KSLMO
        MARIADB_LOG_CONSOLE: "error"

    ports:
      - "3306:3306"
    
    volumes:
      - db_data:/var/lib/mysql
      - ./ressources/db/my_cf.cnf:/etc/mysql/conf.d/my_cf.cnf:ro


  backend:
    build:
        context: ./back-end
        dockerfile: DockerFile

    container_name: my_backend

    environment:
      DB_HOST: "db"
      DB_PORT: 3306
      DB_USER: prodUser
      DB_NAME: chatmanagement
      DB_PASSWORD: prod@mypassword.mariadb


    depends_on:
      - db

    ports:
      - "3000:3000"
    
    command: ["./wait-for-it.sh", "db:3306", "--", "npm", "start"]


volumes:
  db_data:
